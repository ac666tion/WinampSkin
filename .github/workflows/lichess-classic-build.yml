name: Build Lichess Classic APK

on:
  push:
    branches:
      - lichess-classic-ci-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android 4.1-compatible APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      # Current Android command-line tools require JDK 17.
      - name: Install JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 28
        run: sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      # AGP 3.2.1 / Gradle 4.6 requires an older Java runtime.
      - name: Switch to JDK 8 for Gradle 4.6
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify checked-in Lichess Classic sources
        run: |
          test -f LichessClassic/app/build.gradle
          test -f LichessClassic/app/src/main/java/pl/lichessclassic/auth/LichessOAuth.java
          echo "LC_ROOT=$GITHUB_WORKSPACE/LichessClassic" >> "$GITHUB_ENV"

      - name: Download and verify Gradle 4.6
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle-4.6-bin.zip https://services.gradle.org/distributions/gradle-4.6-bin.zip
          echo "98bd5fd2b30e070517e03c51cbb32beee3e2ee1a84003a5a5d748996d4b1b915  /tmp/gradle-4.6-bin.zip" | sha256sum --check
          unzip -q /tmp/gradle-4.6-bin.zip -d /tmp
          /tmp/gradle-4.6/bin/gradle --version

      - name: Build debug APK
        run: |
          cd "$LC_ROOT"
          /tmp/gradle-4.6/bin/gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK metadata and debug signature
        run: |
          APK="$LC_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/28.0.3/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          "$ANDROID_HOME/build-tools/28.0.3/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichessClassic-0.2.1-debug
          path: LichessClassic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
