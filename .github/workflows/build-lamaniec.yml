name: Build Lamaniec Android 4.1 APK

on:
  push:
    branches: ["lamaniec-android41"]
    paths:
      - "Lamaniec41/**"
      - ".github/workflows/build-lamaniec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3

      - name: Install Android 34 platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore original Łamaniec icon
        run: |
          mkdir -p Lamaniec41/app/src/main/res/drawable
          base64 --decode Lamaniec41/icon.png.b64 > Lamaniec41/app/src/main/res/drawable/lamaniec_icon.png
          file Lamaniec41/app/src/main/res/drawable/lamaniec_icon.png

      - name: Build ARMv7 APK
        run: gradle -p Lamaniec41 clean assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lamaniec-Android-4.1-ARMv7
          path: Lamaniec41/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
