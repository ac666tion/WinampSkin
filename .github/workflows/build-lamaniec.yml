name: Build Lamaniec Android 4.1 APK

on:
  push:
    branches: ["lamaniec-android41"]
    paths:
      - "Lamaniec41/**"
      - ".github/workflows/build-lamaniec.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Lamaniec41/**"
      - ".github/workflows/build-lamaniec.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install build platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore original Łamaniec icon
        run: |
          mkdir -p Lamaniec41/app/src/main/res/drawable
          base64 --decode Lamaniec41/icon.png.b64 > Lamaniec41/app/src/main/res/drawable/lamaniec_icon.png
          file Lamaniec41/app/src/main/res/drawable/lamaniec_icon.png

      - name: Build ARMv7 APK
        run: gradle -p Lamaniec41 clean assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lamaniec-Android-4.1-ARMv7
          path: Lamaniec41/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
