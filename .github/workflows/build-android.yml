name: Build Xenamp APK

on:
  push:
    branches:
      - privacy-android-4.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # Current Android command-line tools require JDK 17.
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 11 build tools
        run: sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.2"

      # This project uses Gradle 7.0.2 / AGP 7.0.2, so build with JDK 11.
      - name: Set up Java 11 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Audit APK manifest and permissions
        run: |
          AAPT="$ANDROID_HOME/build-tools/30.0.2/aapt"
          echo "=== Package and SDK levels ==="
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          echo "=== Effective APK permissions ==="
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xenamp-android-4.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
